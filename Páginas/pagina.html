<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameZone - Publicar</title>

    <!-- fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- css da tela de publicar -->
    <link rel="stylesheet" href="../CSS/pagina.css?v=3">
</head>

<body>

    <!-- ícones (ficam escondidos aqui, são chamados nas outras partes da página) -->
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg">

        <!-- logo -->
        <symbol id="i-logo" viewBox="0 0 40 40">
            <rect x="3" y="4" width="34" height="27" rx="9" fill="none" stroke="#6C5CFF" stroke-width="3.5" />
            <path d="M11 31 L9 37 L19 31 Z" fill="#6C5CFF" />
            <path d="M14 15v8M10 19h8" stroke="#6C5CFF" stroke-width="3" stroke-linecap="round" />
            <circle cx="26" cy="17" r="2.2" fill="#6C5CFF" />
            <circle cx="30" cy="22" r="2.2" fill="#6C5CFF" />
        </symbol>

        <!-- lupa da pesquisa -->
        <symbol id="i-busca" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.5" y2="16.5" />
        </symbol>

        <!-- lápis do botão publicar -->
        <symbol id="i-lapis" viewBox="0 0 24 24">
            <path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
        </symbol>

        <!-- três linhas do menu -->
        <symbol id="i-menu" viewBox="0 0 24 24">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </symbol>

        <!-- seta de voltar -->
        <symbol id="i-seta" viewBox="0 0 24 24">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
        </symbol>

        <!-- setinha pra baixo (campos de seleção) -->
        <symbol id="i-seta-baixo" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9" />
        </symbol>

        <!-- ícones da barra da esquerda -->
        <symbol id="i-home" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </symbol>

        <symbol id="i-usuario" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
        </symbol>

        <symbol id="i-pasta" viewBox="0 0 24 24">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </symbol>

        <symbol id="i-controle" viewBox="0 0 24 24">
            <rect x="2" y="6" width="20" height="12" rx="3" />
            <path d="M6 12h4M8 10v4" />
            <circle cx="15.5" cy="11" r="0.8" />
            <circle cx="18" cy="13" r="0.8" />
        </symbol>

        <symbol id="i-engrenagem" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </symbol>

        <!-- ícones da barra de formatação do texto -->
        <symbol id="i-lista" viewBox="0 0 24 24">
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
        </symbol>

        <symbol id="i-imagem" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
        </symbol>

        <symbol id="i-link" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </symbol>

        <symbol id="i-codigo" viewBox="0 0 24 24">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
        </symbol>

        <!-- sinal de mais (botão add mídia) -->
        <symbol id="i-mais" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </symbol>
    </svg>


    <!-- header (barra roxa do topo) -->
    <header class="header">
        <div class="container">

            <!-- logo (ícone + nome) -->
            <a href="../index.html" class="logo">
                <svg class="logo-icone"><use href="#i-logo"></use></svg>
                <span class="logo-texto">GAME<span>ZONE</span></span>
            </a>

            <!-- menu de navegação -->
            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="explorar.html">Explorar</a>
                <a href="#">Notícias</a>
                <a href="#">Guias</a>
                <a href="#">Comunidade</a>
            </nav>

            <!-- campo de pesquisa -->
            <div class="pesquisa">
                <svg class="icone"><use href="#i-busca"></use></svg>
                <input type="text" placeholder="Buscar jogos, notícias...">
            </div>

            <!-- botão publicar -->
            <button type="button" class="btn-publicar" id="btn-publicar">
                <svg class="icone"><use href="#i-lapis"></use></svg>
                PUBLICAR
            </button>

            <!-- botão do menu (três linhas) -->
            <button type="button" class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">
                <svg class="icone"><use href="#i-menu"></use></svg>
            </button>

        </div>

        <!-- menu que abre quando clica nas três linhas -->
        <nav class="menu-mobile" id="menu-mobile">
            <a href="../index.html">Início</a>
            <a href="explorar.html">Explorar</a>
            <a href="#">Notícias</a>
            <a href="#">Guias</a>
            <a href="#">Comunidade</a>
        </nav>
    </header>


    <!-- conteúdo principal -->
    <main class="pub">

        <!-- coluna da esquerda (voltar + barra de ícones + editor) -->
        <div class="pub-esquerda">

            <!-- link pra voltar na notícia anterior -->
            <a href="#" class="pub-voltar">
                <svg class="icone"><use href="#i-seta"></use></svg>
                Voltar para notícia anterior
            </a>

            <!-- barra de ícones e editor lado a lado -->
            <div class="pub-corpo">

                <!-- barra de ícones da esquerda -->
                <nav class="pub-icones">
                    <button type="button" class="ativo" aria-label="Início">
                        <svg class="icone"><use href="#i-home"></use></svg>
                    </button>
                    <button type="button" aria-label="Perfil">
                        <svg class="icone"><use href="#i-usuario"></use></svg>
                    </button>
                    <button type="button" aria-label="Rascunhos">
                        <svg class="icone"><use href="#i-pasta"></use></svg>
                    </button>
                    <button type="button" aria-label="Jogos">
                        <svg class="icone"><use href="#i-controle"></use></svg>
                    </button>
                    <button type="button" aria-label="Configurações">
                        <svg class="icone"><use href="#i-engrenagem"></use></svg>
                    </button>
                </nav>


                <!-- editor da notícia -->
                <section class="pub-editor">

                    <!-- título da notícia -->
                    <input type="text" class="pub-titulo" id="titulo" placeholder="Digite seu título aqui...">

                    <!-- barra de ferramentas do texto -->
                    <div class="pub-toolbar">

                        <!-- botões de formatação (negrito, itálico, riscado, lista, imagem, link e código) -->
                        <div class="pub-formatar">
                            <button type="button" class="negrito" data-acao="negrito" aria-label="Negrito">B</button>
                            <button type="button" class="italico" data-acao="italico" aria-label="Itálico">I</button>
                            <button type="button" class="riscado" data-acao="riscado" aria-label="Riscado">S</button>
                            <button type="button" data-acao="lista" aria-label="Lista">
                                <svg class="icone"><use href="#i-lista"></use></svg>
                            </button>
                            <button type="button" data-acao="imagem" aria-label="Imagem">
                                <svg class="icone"><use href="#i-imagem"></use></svg>
                            </button>
                            <button type="button" data-acao="link" aria-label="Link">
                                <svg class="icone"><use href="#i-link"></use></svg>
                            </button>
                            <button type="button" data-acao="codigo" aria-label="Código">
                                <svg class="icone"><use href="#i-codigo"></use></svg>
                            </button>
                        </div>

                        <!-- botão adicionar mídia -->
                        <button type="button" class="pub-add-midia">
                            <svg class="icone"><use href="#i-mais"></use></svg>
                            add mídia
                        </button>
                    </div>

                    <!-- texto da notícia (div editável, aceita negrito, itálico etc) -->
                    <div class="pub-texto" id="texto" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Escreva sua notícia ou artigo..."></div>

                    <!-- contador de caracteres e palavras -->
                    <div class="pub-contador">Caracteres: 0 | Palavras: 0</div>

                </section>
            </div>
        </div>


        <!-- configurações de publicação (coluna da direita) -->
        <aside class="pub-config">

            <h2>Configurações de Publicação</h2>

            <!-- autor -->
            <div class="pub-campo">
                <label for="autor">Autor</label>
                <div class="pub-autor">
                    <span class="pub-avatar">
                        <svg class="icone"><use href="#i-usuario"></use></svg>
                    </span>
                    <select id="autor" class="pub-select">
                        <option>Avatar</option>
                    </select>
                </div>
            </div>

            <!-- categorias -->
            <div class="pub-campo">
                <label>Categorias</label>
                <div class="pub-tags-linha">
                    <div class="pub-tags" id="categorias">
                        <span class="pub-tag">Jogos<button type="button" class="pub-tag-x" aria-label="Remover Jogos"></button></span>
                        <span class="pub-tag">Notícias<button type="button" class="pub-tag-x" aria-label="Remover Notícias"></button></span>
                        <span class="pub-tag">Hardware<button type="button" class="pub-tag-x" aria-label="Remover Hardware"></button></span>
                        <span class="pub-tag">Dicas<button type="button" class="pub-tag-x" aria-label="Remover Dicas"></button></span>
                    </div>
                    <svg class="icone pub-seta"><use href="#i-seta-baixo"></use></svg>
                </div>
            </div>

            <!-- tags -->
            <div class="pub-campo">
                <label>Tags</label>
                <div class="pub-tags-linha">
                    <div class="pub-tags" id="tags">
                        <span class="pub-tag">Jogos<button type="button" class="pub-tag-x" aria-label="Remover Jogos"></button></span>
                        <span class="pub-tag">Notícias<button type="button" class="pub-tag-x" aria-label="Remover Notícias"></button></span>
                        <span class="pub-tag">Dicas<button type="button" class="pub-tag-x" aria-label="Remover Dicas"></button></span>
                    </div>
                    <svg class="icone pub-seta"><use href="#i-seta-baixo"></use></svg>
                </div>
            </div>

            <!-- imagem de destaque -->
            <div class="pub-campo">
                <label>Imagem de Destaque</label>
                <div class="pub-capa" id="pub-capa">
                    <svg class="icone"><use href="#i-imagem"></use></svg>
                    <p>Adicionar imagem de capa</p>
                    <!-- prévia da imagem escolhida -->
                    <img class="pub-capa-img" id="capa-previa" alt="Prévia da imagem de capa">
                </div>
            </div>

            <!-- opções de seo -->
            <div class="pub-campo">
                <h3>Opções de SEO</h3>
                <label for="meta">Meta Description</label>
                <textarea id="meta"></textarea>
            </div>

            <!-- status e visibilidade -->
            <div class="pub-campo">
                <h3>Status e Visibilidade</h3>

                <div class="pub-duas-colunas">
                    <div>
                        <label for="status">Status</label>
                        <select id="status" class="pub-select">
                            <option>Rascunho</option>
                            <option>Publicado</option>
                        </select>
                    </div>

                    <div>
                        <label for="visibilidade">Visibilidade</label>
                        <select id="visibilidade" class="pub-select">
                            <option>Público</option>
                            <option>Privado</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- agendar publicação -->
            <div class="pub-campo">
                <label for="agendar">Agendar</label>
                <input type="date" id="agendar" class="pub-data">
            </div>

        </aside>

    </main>


    <!-- campos escondidos pra escolher arquivo (abrem quando clica nos botões) -->
    <input type="file" id="arquivo-midia" accept="image/*" hidden>
    <input type="file" id="arquivo-capa" accept="image/*" hidden>

    <!-- aviso que aparece no canto da tela (erro ou sucesso) -->
    <div class="aviso" id="aviso" aria-live="polite"></div>

    <!-- javascript da tela de publicar -->
    <script src="../JS/pagina.js?v=3"></script>

</body>

</html>
